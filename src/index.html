<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <title>THE MET</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <script
      type="module"
      src="scripts/main.js"
      defer
    ></script>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__container">
        <div class="header__top">
          <a
            href="#"
            class="logo logo--header"
          >
            <img
              src="./images/ui-kit/logo.svg"
              alt="the met logo"
              class="logo__img"
            />
          </a>

          <div class="menu">
            <div class="menu__phones">
              <p class="menu__description">The Met Fifth Avenue</p>

              <a
                href="tel:+1 212-535-7710"
                class="menu__description menu__description--tel"
              >
                +1 212-535-7710
              </a>

              <p class="menu__description">The Met Cloisters</p>

              <a
                href="tel:+1 212-535-7710"
                class="menu__description menu__description--tel"
              >
                +1 212-923-3700
              </a>
            </div>

            <a
              href="tel:+1 212-535-7710"
              class="menu__icon menu__icon--margins menu__icon--phone"
            ></a>

            <a
              href="#navigation"
              class="menu__icon menu__icon--menu-opener"
            ></a>
          </div>
        </div>

        <h1 class="header__title header__title--margin-top">
          Welcome
          <br />
          to The MET
        </h1>
      </div>
    </header>
  </body>
</html>
